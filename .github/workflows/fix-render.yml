name: Fix render for undefined arrays

on:
  push:
    paths:
      - '.github/workflows/fix-render.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """try{db=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){db=null;}\nif(!db||!db.items||!db.items.length)db=blankDB();\nreindex();\ndb.lineSeq=db.lineSeq||100;db.manSeq=db.manSeq||1;db.poSeq=db.poSeq||1001;db.sups=db.sups||[];"""
          new = """try{db=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){db=null;}\nif(!db||typeof db!=='object')db=blankDB();\nfunction normalizeDB(){\n  db.items=Array.isArray(db.items)?db.items:[];\n  db.boms=(db.boms&&typeof db.boms==='object')?db.boms:{};\n  db.sos=Array.isArray(db.sos)?db.sos:[];\n  db.pos=Array.isArray(db.pos)?db.pos:[];\n  db.sups=Array.isArray(db.sups)?db.sups:[];\n  db.log=Array.isArray(db.log)?db.log:[];\n  db.lineSeq=db.lineSeq||100;db.manSeq=db.manSeq||1;db.poSeq=db.poSeq||1001;\n}\nnormalizeDB();\nreindex();"""
          if old not in s:
              raise SystemExit('Initial DB block not found')
          s=s.replace(old,new,1)
          s=s.replace("""        db.lineSeq=db.lineSeq||100;db.manSeq=db.manSeq||1;db.poSeq=db.poSeq||1001;db.sups=db.sups||[];\n        reindex();cloudReady=true;""", """        normalizeDB();\n        reindex();cloudReady=true;""",1)
          s=s.replace("""          db=v2;db.lineSeq=db.lineSeq||100;db.manSeq=db.manSeq||1;db.poSeq=db.poSeq||1001;db.sups=db.sups||[];\n          reindex();renderBOM();render();""", """          db=v2;normalizeDB();\n          reindex();renderBOM();render();""",1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify patch
        run: |
          grep -q "function normalizeDB" index.html
          grep -q "normalizeDB();" index.html

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-render.yml
          git commit -m 'Fix render crash when database arrays are undefined'
          git push